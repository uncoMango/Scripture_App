<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ke Aupuni O Ke Akua - Scripture Study</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 800px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      color: #d4a574;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 1rem;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    input::placeholder { color: #888; }

    input:focus {
      outline: none;
      border-color: #5f9ea0;
    }

    button {
      padding: 0.75rem 1.5rem;
      background: #5f9ea0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: #4a8b8e; }
    button:disabled { background: #3a5f60; cursor: not-allowed; }

    .result {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.97rem;
    }

    .error {
      color: #e07070;
      background: rgba(200,50,50,0.1);
      border: 1px solid rgba(200,50,50,0.3);
      border-radius: 8px;
      padding: 1rem;
    }

    .spinner {
      text-align: center;
      color: #aaa;
      padding: 1rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ke Aupuni O Ke Akua</h1>
    <p class="subtitle">Scripture Study Tool</p>

    <div class="search-box">
      <input id="query" type="text" placeholder="Ask a question or search a topic..." autofocus>
      <button id="searchBtn" onclick="search()">Search</button>
    </div>

    <div id="output"></div>
  </div>

  <script>
    document.getElementById("query").addEventListener("keydown", function(e) {
      if (e.key === "Enter") search();
    });

    async function search() {
      const q = document.getElementById("query").value.trim();
      if (!q) return;

      const output = document.getElementById("output");
      const btn = document.getElementById("searchBtn");

      btn.disabled = true;
      output.innerHTML = '<div class="spinner">Searching...</div>';

      try {
        const res = await fetch("/study?q=" + encodeURIComponent(q));
        if (!res.ok) throw new Error("Server error: " + res.status);
        const data = await res.json();

        const text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        output.innerHTML = '<div class="result">' + escapeHtml(text) + '</div>';
      } catch (err) {
        output.innerHTML = '<div class="error">Error: ' + escapeHtml(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
